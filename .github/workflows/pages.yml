# Baut die statische, schreibgeschützte Fassung und veröffentlicht sie auf GitHub Pages.
# Die Daten kommen aus site-data/ im Repo (lokal mit "npm run export:static" erzeugt und committet);
# die GW2-API wird hier nie aufgerufen.
# Einmalig nötig: GitHub → Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein neuerer Push ersetzt ein laufendes nicht mitten im Lauf.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # Projektseite unter https://<konto>.github.io/<repo>/. Repo-Name: gw2-fractal-items.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
