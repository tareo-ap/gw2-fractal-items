# Builds the static, read-only version and publishes it to GitHub Pages.
# The data comes from site-data/ in the repo (generated locally with "npm run export:static" and committed);
# the GW2 API is never called here.
# One-time setup: GitHub -> Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows starting the workflow manually from the Actions tab

# Minimal token rights; pages: write and id-token: write are required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push does not cancel a running one mid-run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # Project site at https://<account>.github.io/<repo>/. Repo name: gw2-fractal-items.
          VITE_BASE: /${{ github.event.repository.name }}/
      # Prepare the Pages environment, then hand web/dist to the deploy job as an artifact.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
