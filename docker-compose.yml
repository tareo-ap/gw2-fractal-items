services:
  gw2-items:
    build: .
    image: gw2-items:latest
    container_name: gw2-items
    restart: unless-stopped
    environment:
      # Automatic check for new game builds (image default is on, off disables it).
      # Schedule, all optional (defaults as shown):
      # UPDATE_CHECK: "on"
      # UPDATE_CHECK_TZ: "Europe/Berlin"
      # UPDATE_CHECK_DAILY_AT: "06:00"
      # UPDATE_CHECK_PATCH_WINDOW: "Tue 17:00-19:00"
      # UPDATE_CHECK_PATCH_EVERY_MINUTES: "30"
    ports:
      - "3000:3000"
    volumes:
      - gw2-items-data:/data

volumes:
  gw2-items-data:
